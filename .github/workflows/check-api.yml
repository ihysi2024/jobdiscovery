name: Check public API

# Confirms what the web app can see with the publishable key: the job_listings
# view should be readable and the raw tables should not.

on:
  workflow_dispatch:
    inputs:
      key:
        description: "Supabase publishable key (sb_publishable_...)"
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      URL: https://esajgoakrjmtnpwssclk.supabase.co
      KEY: ${{ inputs.key }}
    steps:
      - name: Query as the web app
        run: |
          [[ "$KEY" =~ ^sb_publishable_[A-Za-z0-9_-]+$ ]] || { echo "::error::not a publishable key"; exit 1; }
          get() { curl -s -o /tmp/body -w "%{http_code}" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
                    -H "Prefer: count=exact" -D /tmp/headers "$URL/rest/v1/$1"; }
          code=$(get "job_listings?select=id,company_name,title,industry,role_family,salary_min_annual&limit=3")
          echo "job_listings -> HTTP $code, total $(grep -i content-range /tmp/headers | tr -d '\r')"
          head -c 1200 /tmp/body; echo
          [[ "$code" =~ ^20[06]$ ]] || { echo "::error::the web app can't read job_listings"; exit 1; }
          for v in jobs_search job_facets market_stats; do
            code=$(get "$v?select=*&limit=1")
            echo "$v -> HTTP $code, total $(grep -i content-range /tmp/headers | tr -d '\r')"
            [[ "$code" =~ ^20[06]$ ]] || { echo "::error::the web app can't read $v"; exit 1; }
          done
          fail=0
          for t in postings boards runs job_features schema_meta profiles preferences job_feedback tracked_jobs plans app_migrations; do
            code=$(get "$t?select=*&limit=1")
            rows=$(head -c 2 /tmp/body)
            echo "$t -> HTTP $code $(head -c 160 /tmp/body)"
            if [[ "$code" =~ ^20[06]$ ]] && [ "$rows" != "[]" ]; then echo "::error::$t is readable with the public key"; fail=1; fi
          done
          exit $fail

      - name: Google sign-in is set up
        run: |
          back="https://jobdiscovery-navy.vercel.app/auth/callback"
          out=$(curl -s -o /tmp/auth -w "%{http_code} %{redirect_url}" -H "apikey: $KEY" \
                "$URL/auth/v1/authorize?provider=google&redirect_to=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$back")")
          echo "authorize -> $out"
          head -c 300 /tmp/auth; echo
          loc=${out#* }
          case "$loc" in
            https://accounts.google.com/*)
              echo "Redirects to Google. Client: $(python3 -c "import urllib.parse,sys;q=urllib.parse.parse_qs(urllib.parse.urlparse(sys.argv[1]).query);print(q.get('client_id',['?'])[0][:24]+'…', q.get('redirect_uri'))" "$loc")" ;;
            *) echo "::error::Supabase doesn't send sign-in to Google yet (is the Google provider on and saved?)"; exit 1 ;;
          esac
