name: Daily poll

# Polls every board that's due, classifies new or changed jobs, then runs the health check.
# A failed run (or failed check) makes this workflow fail, and GitHub emails you.

on:
  schedule:
    # 09:47 UTC daily (about 5am New York in winter, 4am in summer).
    # Off the hour on purpose: GitHub delays jobs scheduled at :00.
    - cron: "47 9 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Poll at most this many boards (blank = all due)"
        required: false
        default: ""

# Never run two polls at once; a new one waits for the current one to finish.
concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JOBDISCOVERY_CONTACT: ${{ vars.JOBDISCOVERY_CONTACT }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install ".[postgres,process]"

      - name: Check configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add a DATABASE_URL repository secret (see README: Deploying)."
            exit 1
          fi

      - name: Poll due boards
        # Time budgets (poll 3h + process 1h40m) keep the job inside GitHub's
        # 6-hour limit; anything unfinished stays queued for tomorrow.
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS="--max-minutes 180"
          if [[ "$LIMIT" =~ ^[0-9]+$ ]]; then ARGS="$ARGS --limit $LIMIT"; fi
          jobdiscovery poll $ARGS

      - name: Cache embedding model
        if: env.ANTHROPIC_API_KEY != ''
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Classify new and changed jobs
        # Skipped until an ANTHROPIC_API_KEY secret is added. Only jobs whose
        # content changed since they were last classified cost anything.
        if: env.ANTHROPIC_API_KEY != ''
        run: jobdiscovery process --max-minutes 100 --max-cost 15

      - name: Health check
        run: jobdiscovery check

      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            jobdiscovery report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
