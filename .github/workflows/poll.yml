name: Daily poll

# Polls every board that's due, then runs the health check. When it finishes,
# "Classify jobs" (classify.yml) starts and labels the new or changed jobs.
# A failed run (or failed check) makes this workflow fail, and GitHub emails you.

on:
  schedule:
    # 09:47 UTC daily (4:47am New York in winter), plus 16:37 UTC as a backup in
    # case GitHub skips the first one. The second run is cheap: boards checked
    # earlier that day aren't due again. Off the hour on purpose: GitHub
    # delays jobs scheduled at :00.
    - cron: "47 9 * * *"
    - cron: "37 16 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Poll at most this many boards (blank = all due)"
        required: false
        default: ""

# Never run two polls at once; a new one waits for the current one to finish.
concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JOBDISCOVERY_CONTACT: ${{ vars.JOBDISCOVERY_CONTACT }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install ".[postgres]"

      - name: Check configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add a DATABASE_URL repository secret (see README: Deploying)."
            exit 1
          fi

      - name: Poll due boards
        # A 4-hour budget keeps the job inside GitHub's 6-hour limit;
        # boards not reached stay due for tomorrow.
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS="--max-minutes 240"
          if [[ "$LIMIT" =~ ^[0-9]+$ ]]; then ARGS="$ARGS --limit $LIMIT"; fi
          jobdiscovery poll $ARGS

      - name: Health check
        run: jobdiscovery check

      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            jobdiscovery report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
