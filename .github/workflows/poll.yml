name: Daily poll

# Polls every board that's due, then runs the health check.
# A failed run (or failed check) makes this workflow fail, and GitHub emails you.

on:
  schedule:
    # 09:47 UTC daily (about 5am New York in winter, 4am in summer).
    # Off the hour on purpose: GitHub delays jobs scheduled at :00.
    - cron: "47 9 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Poll at most this many boards (blank = all due)"
        required: false
        default: ""

# Never run two polls at once; a new one waits for the current one to finish.
concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JOBDISCOVERY_CONTACT: ${{ vars.JOBDISCOVERY_CONTACT }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install ".[postgres]"

      - name: Check configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add a DATABASE_URL repository secret (see README: Deploying)."
            exit 1
          fi

      - name: Poll due boards
        # Stop starting new boards after 5 hours so the job finishes inside
        # GitHub's 6-hour limit; anything left stays due for tomorrow.
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS="--max-minutes 300"
          if [[ "$LIMIT" =~ ^[0-9]+$ ]]; then ARGS="$ARGS --limit $LIMIT"; fi
          jobdiscovery poll $ARGS

      - name: Health check
        run: jobdiscovery check

      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            jobdiscovery report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
