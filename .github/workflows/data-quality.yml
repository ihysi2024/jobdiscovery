name: Data quality

# Manual: counts of open NYC postings with empty or junk descriptions, by hiring
# system, plus a few public example ids. Job postings are public data; nothing
# personal is read.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Descriptions
        run: |
          psql "$DATABASE_URL" -c "
          select b.ats, count(*) as open_nyc,
                 count(*) filter (where coalesce(p.description_text, '') = '') as empty,
                 count(*) filter (where p.description_text ~* '\mnull\M') as has_null_word,
                 count(*) filter (where p.description_text ~* '(\mnull\M\W*){2,}') as null_null,
                 count(*) filter (where jf.summary ~* '\mnull\M') as summary_null
          from postings p join boards b on b.key = p.board_key left join job_features jf on jf.posting_id = p.id
          where p.closed_at is null and p.is_nyc = 1 group by 1 order by 2 desc"
          psql "$DATABASE_URL" -c "
          select p.id, b.ats, left(p.title, 40) as title,
                 left(regexp_replace(substring(p.description_text from '(?i)(.{0,60}\mnull\M.{0,60})'), '\s+', ' ', 'g'), 130) as around
          from postings p join boards b on b.key = p.board_key
          where p.closed_at is null and p.is_nyc = 1 and p.description_text ~* '(\mnull\M\W*){2,}'
          order by p.id desc limit 12"
          psql "$DATABASE_URL" -c "
          select p.id, b.ats, left(p.title, 35) as title, left(jf.summary, 110) as summary, left(jf.skills, 60) as skills
          from postings p join boards b on b.key = p.board_key join job_features jf on jf.posting_id = p.id
          where p.closed_at is null and p.is_nyc = 1 and jf.summary ~* '\mnull\M'
          order by b.ats, p.id desc limit 10"
          psql "$DATABASE_URL" -c "
          select b.ats, count(*) filter (where jf.skills ~* '\mnull\M') as skills_null, count(*) filter (where jf.company_name ~* '^null$') as company_null,
                 count(*) filter (where jf.role_title ~* '^null$') as title_null
          from postings p join boards b on b.key = p.board_key join job_features jf on jf.posting_id = p.id
          where p.closed_at is null and p.is_nyc = 1 group by 1 order by 1"

      - name: Where Best match spends its time (plan timings only; ids masked)
        run: |
          psql "$DATABASE_URL" -At <<'SQL' | sed -E 's/[0-9a-f]{8}-[0-9a-f-]{27}/<user>/g' | grep -E "actual time|Execution Time|Planning Time" | sort -t= -k3 -rn | head -40
          select set_config('request.jwt.claim.sub', (select user_id::text from profiles where embedding is not null order by updated_at desc limit 1), false);
          explain (analyze, costs off, buffers off) select * from match_jobs(p_limit => 20);
          explain (analyze, costs off) select count(*) from jobs_search;
          explain (analyze, costs off) select * from job_facet_counts();
          SQL
