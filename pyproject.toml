[project]
name = "jobdiscovery"
version = "0.1.0"
description = "Find every employer with open New York jobs on public hiring-system boards."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
process = ["fastembed>=0.5"]
claude = ["anthropic>=0.75"]
dev = ["pytest>=8"]

[project.scripts]
jobdiscovery = "jobdiscovery.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobdiscovery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
